# Pre-built images: https://github.com/sr-patel/kiwi/pkgs/container/kiwi-backend
# To build locally instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  backend:
    image: ghcr.io/sr-patel/kiwi-backend:latest
    pull_policy: always
    container_name: kiwi-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Mount your Eagle library folder (edit the left side to your path):
      #
      # Windows example (forward slashes):
      # - C:/Users/YourName/Pictures/MyPhotos.library:/app/data/libraries/MyPhotos.library:ro
      #
      # Mac example:
      # - /Users/YourName/Pictures/MyPhotos.library:/app/data/libraries/MyPhotos.library:ro
      #
      # Linux example:
      # - /home/YourName/Pictures/MyPhotos.library:/app/data/libraries/MyPhotos.library:ro
      #
      # Default dev example (relative to this repo):
      - ./example.library:/app/data/libraries/example.library:ro
      # Config must be writable so the setup wizard can save your library path
      - ./config.json:/app/config.json:rw
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - kiwi-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/sr-patel/kiwi-frontend:latest
    pull_policy: always
    container_name: kiwi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kiwi-network

networks:
  kiwi-network:
    driver: bridge
