# Optional override: build images locally instead of pulling from GHCR.
# Usage: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/sr-patel/kiwi-backend:latest
    pull_policy: build

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/sr-patel/kiwi-frontend:latest
    pull_policy: build
